<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>HANGMAN88 | Landscape Edition</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Nunito:wght@700;900&family=Special+Elite&display=swap" rel="stylesheet">
  <style>
    /* --- 5 LANDSCAPE THEMES --- */
    :root {
      /* Theme 1: Sunset (Orange/Purple) */
      --bg: #1a1025;
      --bg-grad: linear-gradient(180deg, #3a1c4a 0%, #d46a2a 60%, #f4d03f 100%);
      --text-main: #fdf4d4;
      --text-accent: #f4d03f;
      --text-muted: #b089a3;
      --card-bg: rgba(26, 16, 37, 0.85);
      --border-color: #d46a2a;
      --btn-bg: rgba(58, 28, 74, 0.9);
      --btn-border: #d46a2a;
      --btn-text: #fdf4d4;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --header-font: 'Cinzel', serif;
      --body-font: 'Nunito', sans-serif;
      --logo-shadow: 2px 2px 0 #000, 4px 4px 0 #f4d03f;
    }

    [data-theme="storm"] {
      /* Theme 2: Storm (Teal/Dark Grey) */
      --bg: #0a1114;
      --bg-grad: linear-gradient(180deg, #1c2e36 0%, #0a1114 100%);
      --text-main: #e0e8ed;
      --text-accent: #7fb3d5;
      --text-muted: #6b8a9a;
      --card-bg: rgba(10, 17, 20, 0.85);
      --border-color: #4a7a8a;
      --btn-bg: rgba(28, 46, 54, 0.9);
      --btn-border: #4a7a8a;
      --btn-text: #e0e8ed;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --header-font: 'Special Elite', monospace;
      --body-font: 'Nunito', sans-serif;
      --logo-shadow: 2px 2px 0 #000, 4px 4px 0 #7fb3d5;
    }

    [data-theme="midnight"] {
      /* Theme 3: Midnight (Deep Blue/Black) */
      --bg: #05080a;
      --bg-grad: radial-gradient(circle at 50% 0%, #1a2a40 0%, #05080a 100%);
      --text-main: #cbd4d8;
      --text-accent: #fde74c;
      --text-muted: #4a5a6a;
      --card-bg: rgba(5, 8, 10, 0.85);
      --border-color: #2a3a4a;
      --btn-bg: rgba(26, 42, 64, 0.9);
      --btn-border: #2a3a4a;
      --btn-text: #cbd4d8;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --header-font: 'Special Elite', monospace;
      --body-font: 'Nunito', sans-serif;
      --logo-shadow: 2px 2px 0 #000, 4px 4px 0 #fde74c;
    }

    [data-theme="mist"] {
      /* Theme 4: Mist (Soft Grey/Blue) */
      --bg: #2c3a47;
      --bg-grad: linear-gradient(180deg, #5a6f7c 0%, #2c3a47 100%);
      --text-main: #e8edf0;
      --text-accent: #a0c4d4;
      --text-muted: #8899a6;
      --card-bg: rgba(44, 58, 71, 0.85);
      --border-color: #6b7f8c;
      --btn-bg: rgba(90, 111, 124, 0.9);
      --btn-border: #6b7f8c;
      --btn-text: #e8edf0;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --header-font: 'Cinzel', serif;
      --body-font: 'Nunito', sans-serif;
      --logo-shadow: 2px 2px 0 #000, 4px 4px 0 #a0c4d4;
    }

    [data-theme="ocean"] {
      /* Theme 5: Ocean (Vibrant Blue/Teal) */
      --bg: #041220;
      --bg-grad: linear-gradient(180deg, #0b4d6b 0%, #041220 100%);
      --text-main: #d4f1f9;
      --text-accent: #48c9b0;
      --text-muted: #3a6a7a;
      --card-bg: rgba(4, 18, 32, 0.85);
      --border-color: #1a6a8a;
      --btn-bg: rgba(11, 77, 107, 0.9);
      --btn-border: #1a6a8a;
      --btn-text: #d4f1f9;
      --correct: #2ecc71;
      --wrong: #e74c3c;
      --header-font: 'Cinzel', serif;
      --body-font: 'Nunito', sans-serif;
      --logo-shadow: 2px 2px 0 #000, 4px 4px 0 #48c9b0;
    }

    /* --- RESET & BASE --- */
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

    body {
      font-family: var(--body-font);
      background-color: var(--bg);
      background-image: var(--bg-grad);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      transition: all 0.5s ease;
      overflow-x: hidden;
      padding: 10px;
      position: relative;
    }

    /* Vintage Film Grain overlay */
    body::before {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.08'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 1000;
    }

    header {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 15px;
      margin-top: 10px;
      gap: 10px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
    }

    h1 {
      font-family: var(--header-font);
      font-size: 2.8rem;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--text-accent);
      text-shadow: var(--logo-shadow);
      text-align: center;
      line-height: 1;
    }

    .theme-switcher {
      display: flex;
      gap: 10px;
      margin-top: 5px;
    }

    .theme-btn {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      border: 3px solid var(--border-color);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      box-shadow: 0 3px 0 rgba(0,0,0,0.5);
    }
    .theme-btn:hover { transform: scale(1.1); }
    .theme-btn:active { transform: translateY(3px); box-shadow: 0 0 0 rgba(0,0,0,0.5); }
    .theme-btn.sunset { background: #d46a2a; }
    .theme-btn.storm { background: #4a7a8a; }
    .theme-btn.midnight { background: #1a2a40; }
    .theme-btn.mist { background: #8899a6; }
    .theme-btn.ocean { background: #48c9b0; }

    /* --- SETUP PANEL --- */
    .setup-panel {
      width: 100%;
      max-width: 600px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding: 20px;
      background: var(--card-bg);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      margin-top: 15px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      transition: opacity 0.3s;
    }

    .setup-panel h2 {
      font-family: var(--header-font);
      font-size: 1.5rem;
      color: var(--text-accent);
      text-align: center;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .mode-select {
      display: flex;
      gap: 10px;
    }

    .mode-btn {
      flex: 1;
      padding: 15px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 2px solid var(--btn-border);
      border-radius: 6px;
      font-family: var(--body-font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-btn.active {
      border-color: var(--text-accent);
      background: var(--text-accent);
      color: #000;
    }

    .pvp-input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }

    .pvp-input-group input {
      padding: 15px;
      border-radius: 6px;
      border: 2px solid var(--border-color);
      background: rgba(0,0,0,0.4);
      color: var(--text-main);
      font-family: var(--body-font);
      font-size: 1.1rem;
      outline: none;
      text-align: center;
      letter-spacing: 2px;
    }

    .pvp-input-group input::placeholder {
      color: var(--text-muted);
      letter-spacing: 1px;
    }

    .start-btn {
      padding: 15px;
      background: var(--text-accent);
      color: #000;
      border: 2px solid var(--border-color);
      border-radius: 6px;
      font-family: var(--header-font);
      font-size: 1.2rem;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.1s;
      text-transform: uppercase;
      letter-spacing: 2px;
    }
    .start-btn:active {
      transform: scale(0.98);
    }

    /* --- GAME PANEL --- */
    .game-panel {
      width: 100%;
      max-width: 600px;
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 20px;
      margin-top: 15px;
    }

    /* Hangman Drawing Area */
    .drawing-area {
      width: 100%;
      max-width: 300px;
      height: 200px;
      background: rgba(0,0,0,0.4);
      border: 2px solid var(--border-color);
      border-radius: 8px;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .hangman-svg {
      width: 100%;
      height: 100%;
    }

    .hangman-svg line, .hangman-svg circle, .hangman-svg path {
      stroke: var(--text-accent);
      stroke-width: 4;
      stroke-linecap: round;
      fill: none;
      transition: opacity 0.3s ease;
    }

    .hangman-svg .hidden {
      opacity: 0;
    }

    /* Word Display */
    .word-display {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
      padding: 10px;
      min-height: 60px;
    }

    .letter-slot {
      width: 35px;
      height: 50px;
      border-bottom: 4px solid var(--text-accent);
      display: flex;
      justify-content: center;
      align-items: flex-end;
      font-family: var(--header-font);
      font-size: 2rem;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--text-main);
      transition: all 0.3s;
    }

    .letter-slot.revealed {
      color: var(--text-accent);
    }

    /* Game Stats */
    .game-stats {
      display: flex;
      justify-content: space-between;
      width: 100%;
      max-width: 400px;
      background: var(--card-bg);
      padding: 10px 20px;
      border-radius: 8px;
      border: 2px solid var(--border-color);
    }

    .stat-item {
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .stat-label {
      font-size: 0.75rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .stat-value {
      font-family: var(--header-font);
      font-size: 1.5rem;
      color: var(--text-accent);
    }

    /* On-Screen Keyboard */
    .keyboard {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 500px;
    }

    .key-row {
      display: flex;
      justify-content: center;
      gap: 6px;
    }

    .key {
      flex: 1;
      padding: 15px 0;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 2px solid var(--btn-border);
      border-radius: 6px;
      font-family: var(--body-font);
      font-size: 1.1rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 4px 0 var(--btn-border);
      transition: all 0.1s;
      display: flex;
      justify-content: center;
      align-items: center;
      min-width: 0;
      user-select: none;
    }

    .key:active {
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--btn-border);
    }

    .key.correct {
      background: var(--correct);
      border-color: #1e8e4e;
      color: #fff;
      opacity: 0.8;
    }

    .key.wrong {
      background: var(--wrong);
      border-color: #a02c20;
      color: #fff;
      opacity: 0.6;
    }

    .key:disabled {
      cursor: not-allowed;
      transform: translateY(4px);
      box-shadow: 0 0 0 var(--btn-border);
    }

    /* Controls */
    .controls {
      width: 100%;
      max-width: 500px;
      display: flex;
      gap: 10px;
      margin-top: 10px;
    }

    .action-btn {
      flex: 1;
      padding: 15px;
      background: var(--btn-bg);
      color: var(--btn-text);
      border: 3px solid var(--btn-border);
      border-radius: 8px;
      font-family: var(--body-font);
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 1px;
      cursor: pointer;
      box-shadow: 0 5px 0 var(--btn-border);
      transition: all 0.1s;
      text-transform: uppercase;
    }

    .action-btn:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 var(--btn-border);
    }

    /* Modal */
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
      z-index: 100;
      backdrop-filter: blur(4px);
    }

    .modal.show {
      opacity: 1;
      pointer-events: auto;
    }

    .modal-content {
      background: var(--bg);
      padding: 40px 30px;
      border-radius: 8px;
      text-align: center;
      border: 4px solid var(--text-accent);
      box-shadow: 0 15px 0 rgba(0,0,0,0.8);
      transform: scale(0.8);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      max-width: 90vw;
      position: relative;
    }

    .modal.show .modal-content {
      transform: scale(1);
    }

    .modal-content h2 {
      font-family: var(--header-font);
      font-size: 2.2rem;
      color: var(--text-accent);
      margin-bottom: 15px;
      text-transform: uppercase;
      text-shadow: var(--logo-shadow);
    }

    .modal-content p {
      font-family: var(--body-font);
      font-size: 1.2rem;
      color: var(--text-main);
      margin-bottom: 25px;
      line-height: 1.5;
    }

    .modal-content .answer-reveal {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      color: var(--correct);
      letter-spacing: 5px;
      margin: 15px 0;
      text-shadow: 2px 2px 0 rgba(0,0,0,0.5);
    }

    .modal-content button {
      padding: 15px 30px;
      background: var(--text-accent);
      color: #fff;
      border: 3px solid #000;
      border-radius: 6px;
      font-family: var(--body-font);
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 5px 0 #000;
      text-transform: uppercase;
      width: 100%;
    }

    .modal-content button:active {
      transform: translateY(5px);
      box-shadow: 0 0 0 #000;
    }

    footer {
      width: 100%;
      text-align: center;
      padding: 15px 10px;
      font-family: var(--body-font);
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 1px;
      background: rgba(0,0,0,0.2);
      border-radius: 10px;
      margin-top: auto;
      border-top: 2px solid var(--border-color);
    }

    footer pre {
      font-family: monospace;
      font-size: 0.6rem;
      margin-top: 5px;
      white-space: pre;
      overflow-x: auto;
      opacity: 0.7;
    }

    /* Responsive */
    @media (max-width: 500px) {
      h1 { font-size: 2rem; }
      .letter-slot { width: 25px; height: 40px; font-size: 1.5rem; }
      .key { font-size: 0.9rem; padding: 12px 0; }
      .action-btn { font-size: 0.85rem; padding: 12px; }
      .modal-content h2 { font-size: 1.6rem; }
    }
  </style>
</head>
<body data-theme="sunset">

  <header>
    <h1>HANGMAN88</h1>
    <div class="theme-switcher">
      <button class="theme-btn sunset" data-theme="sunset" title="Sunset"></button>
      <button class="theme-btn storm" data-theme="storm" title="Storm"></button>
      <button class="theme-btn midnight" data-theme="midnight" title="Midnight"></button>
      <button class="theme-btn mist" data-theme="mist" title="Mist"></button>
      <button class="theme-btn ocean" data-theme="ocean" title="Ocean"></button>
    </div>
  </header>

  <!-- Setup Screen -->
  <div class="setup-panel" id="setupPanel">
    <h2>Select Game Mode</h2>
    <div class="mode-select">
      <button class="mode-btn active" id="modeBotBtn">Vs Bot (50 Words)</button>
      <button class="mode-btn" id="modePvPBtn">Vs Player 2</button>
    </div>
    
    <!-- PvP Input (Hidden by default) -->
    <div class="pvp-input-group" id="pvpInputGroup" style="display: none;">
      <input type="text" id="pvpWordInput" placeholder="Enter secret word here..." maxlength="20" autocomplete="off" autocorrect="off" autocapitalize="characters">
      <button class="start-btn" id="startPvPBtn">Hide Word & Start Game</button>
    </div>
    
    <button class="start-btn" id="startBotBtn">Start Game</button>
  </div>

  <!-- Game Screen -->
  <div class="game-panel" id="gamePanel">
    <div class="drawing-area">
      <svg class="hangman-svg" id="hangmanSvg" viewBox="0 0 200 200">
        <!-- Gallows (Always visible) -->
        <line x1="20" y1="180" x2="180" y2="180" class="visible" />
        <line x1="60" y1="180" x2="60" y2="20" class="visible" />
        <line x1="60" y1="20" x2="140" y2="20" class="visible" />
        <line x1="140" y1="20" x2="140" y2="40" class="visible" />
        
        <!-- Body Parts (Hidden initially) -->
        <circle cx="140" cy="55" r="15" class="hidden" id="part-head" />
        <line x1="140" y1="70" x2="140" y2="120" class="hidden" id="part-body" />
        <line x1="140" y1="80" x2="110" y2="100" class="hidden" id="part-left-arm" />
        <line x1="140" y1="80" x2="170" y2="100" class="hidden" id="part-right-arm" />
        <line x1="140" y1="120" x2="115" y2="160" class="hidden" id="part-left-leg" />
        <line x1="140" y1="120" x2="165" y2="160" class="hidden" id="part-right-leg" />
      </svg>
    </div>

    <div class="game-stats">
      <div class="stat-item">
        <span class="stat-label">Lives Left</span>
        <span class="stat-value" id="livesLeft">6</span>
      </div>
      <div class="stat-item">
        <span class="stat-label">Mode</span>
        <span class="stat-value" id="currentModeDisplay">Bot</span>
      </div>
    </div>

    <div class="word-display" id="wordDisplay">
      <!-- Letter slots generated by JS -->
    </div>

    <div class="keyboard" id="keyboard">
      <div class="key-row">
        <button class="key" data-key="Q">Q</button>
        <button class="key" data-key="W">W</button>
        <button class="key" data-key="E">E</button>
        <button class="key" data-key="R">R</button>
        <button class="key" data-key="T">T</button>
        <button class="key" data-key="Y">Y</button>
        <button class="key" data-key="U">U</button>
        <button class="key" data-key="I">I</button>
        <button class="key" data-key="O">O</button>
        <button class="key" data-key="P">P</button>
      </div>
      <div class="key-row">
        <button class="key" data-key="A">A</button>
        <button class="key" data-key="S">S</button>
        <button class="key" data-key="D">D</button>
        <button class="key" data-key="F">F</button>
        <button class="key" data-key="G">G</button>
        <button class="key" data-key="H">H</button>
        <button class="key" data-key="J">J</button>
        <button class="key" data-key="K">K</button>
        <button class="key" data-key="L">L</button>
      </div>
      <div class="key-row">
        <button class="key" data-key="Z">Z</button>
        <button class="key" data-key="X">X</button>
        <button class="key" data-key="C">C</button>
        <button class="key" data-key="V">V</button>
        <button class="key" data-key="B">B</button>
        <button class="key" data-key="N">N</button>
        <button class="key" data-key="M">M</button>
      </div>
    </div>

    <div class="controls">
      <button class="action-btn" id="restartBtn">Quit to Menu</button>
    </div>
  </div>

  <footer>
    <div>mohamed005cheikh@gmail.com | by MC88</div>
    <pre>
█   █  ███   ███   ███
██ ██ █     █   █ █   █
█ █ █ █      ███   ███
█   █ █     █   █ █   █
█   █  ███   ███   ███
    </pre>
  </footer>

  <div class="modal" id="endModal">
    <div class="modal-content">
      <h2 id="modalTitle">Game Over</h2>
      <p id="modalMessage">The word was:</p>
      <div class="answer-reveal" id="answerReveal">WORD</div>
      <button id="playAgainBtn">Play Again</button>
    </div>
  </div>

  <script>
    // =============================================
    // HANGMAN88 - Landscape Edition
    // =============================================

    // 50 Pre-made words for Vs Bot
    const WORD_BANK = [
      "APPLE", "HOUSE", "RIVER", "MOUNTAIN", "OCEAN", "TIGER", "CLOUD", "STORM", "SUNSET", "WINTER",
      "SUMMER", "AUTUMN", "SPRING", "FOREST", "DESERT", "ISLAND", "VALLEY", "GARDEN", "CASTLE", "BRIDGE",
      "MARKET", "SCHOOL", "LIBRARY", "MUSEUM", "THEATER", "GALAXY", "PLANET", "ROCKET", "ENGINE", "MACHINE",
      "GUITAR", "PIANO", "VIOLIN", "DRAGON", "PHOENIX", "KNIGHT", "WIZARD", "PIRATE", "NINJA", "ROBOT",
      "CAMERA", "PENCIL", "PAPER", "WINDOW", "MIRROR", "CANDLE", "DIAMOND", "SILVER", "GOLDEN", "PURPLE"
    ];

    // State
    let secretWord = "";
    let guessedLetters = new Set();
    let wrongGuesses = 0;
    const MAX_WRONG = 6;
    let gameMode = 'bot'; // 'bot' or 'pvp'
    let isGameOver = false;

    // DOM Elements
    const setupPanel = document.getElementById('setupPanel');
    const gamePanel = document.getElementById('gamePanel');
    const modeBotBtn = document.getElementById('modeBotBtn');
    const modePvPBtn = document.getElementById('modePvPBtn');
    const pvpInputGroup = document.getElementById('pvpInputGroup');
    const pvpWordInput = document.getElementById('pvpWordInput');
    const startBotBtn = document.getElementById('startBotBtn');
    const startPvPBtn = document.getElementById('startPvPBtn');
    const restartBtn = document.getElementById('restartBtn');
    const wordDisplay = document.getElementById('wordDisplay');
    const keyboardEl = document.getElementById('keyboard');
    const livesLeftEl = document.getElementById('livesLeft');
    const currentModeDisplay = document.getElementById('currentModeDisplay');
    const endModal = document.getElementById('endModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalMessage = document.getElementById('modalMessage');
    const answerReveal = document.getElementById('answerReveal');
    const playAgainBtn = document.getElementById('playAgainBtn');

    // Hangman SVG parts
    const parts = [
      document.getElementById('part-head'),
      document.getElementById('part-body'),
      document.getElementById('part-left-arm'),
      document.getElementById('part-right-arm'),
      document.getElementById('part-left-leg'),
      document.getElementById('part-right-leg')
    ];

    // --- Initialization ---
    function init() {
      // Load Theme
      const savedTheme = localStorage.getItem('hangman88_theme') || 'sunset';
      document.body.setAttribute('data-theme', savedTheme);

      // Theme Switcher
      document.querySelectorAll('.theme-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.body.setAttribute('data-theme', btn.dataset.theme);
          localStorage.setItem('hangman88_theme', btn.dataset.theme);
        });
      });

      // Mode Selection
      modeBotBtn.addEventListener('click', () => {
        gameMode = 'bot';
        modeBotBtn.classList.add('active');
        modePvPBtn.classList.remove('active');
        pvpInputGroup.style.display = 'none';
        startBotBtn.style.display = 'block';
      });

      modePvPBtn.addEventListener('click', () => {
        gameMode = 'pvp';
        modePvPBtn.classList.add('active');
        modeBotBtn.classList.remove('active');
        pvpInputGroup.style.display = 'flex';
        startBotBtn.style.display = 'none';
      });

      // Start Game Buttons
      startBotBtn.addEventListener('click', () => {
        const randomIndex = Math.floor(Math.random() * WORD_BANK.length);
        startGame(WORD_BANK[randomIndex]);
      });

      startPvPBtn.addEventListener('click', () => {
        const word = pvpWordInput.value.trim().toUpperCase();
        if (!word || word.length < 3) {
          alert("Please enter a word with at least 3 letters.");
          return;
        }
        if (!/^[A-Z]+$/.test(word)) {
          alert("Please use only letters A-Z.");
          return;
        }
        pvpWordInput.value = ''; // Clear the input for secrecy
        startGame(word);
      });

      // Keyboard Event Listeners
      document.querySelectorAll('.key').forEach(key => {
        key.addEventListener('click', () => handleGuess(key.dataset.key));
      });

      // Controls
      restartBtn.addEventListener('click', resetToMenu);
      playAgainBtn.addEventListener('click', resetToMenu);
    }

    // --- Game Logic ---
    function startGame(word) {
      secretWord = word;
      guessedLetters.clear();
      wrongGuesses = 0;
      isGameOver = false;

      // Update UI
      setupPanel.style.display = 'none';
      gamePanel.style.display = 'flex';
      endModal.classList.remove('show');
      
      // Update Mode Display
      currentModeDisplay.textContent = gameMode === 'bot' ? 'Bot' : 'Player 2';
      
      // Reset Keyboard
      document.querySelectorAll('.key').forEach(key => {
        key.disabled = false;
        key.className = 'key';
      });

      // Reset Hangman Drawing
      parts.forEach(part => part.classList.add('hidden'));
      updateLivesDisplay();

      // Render Word Slots
      renderWordDisplay();
    }

    function renderWordDisplay() {
      wordDisplay.innerHTML = '';
      for (let i = 0; i < secretWord.length; i++) {
        const slot = document.createElement('div');
        slot.classList.add('letter-slot');
        slot.dataset.index = i;
        slot.dataset.letter = secretWord[i];
        wordDisplay.appendChild(slot);
      }
      updateWordDisplay();
    }

    function updateWordDisplay() {
      const slots = document.querySelectorAll('.letter-slot');
      slots.forEach(slot => {
        const letter = slot.dataset.letter;
        if (guessedLetters.has(letter)) {
          slot.textContent = letter;
          slot.classList.add('revealed');
        } else {
          slot.textContent = '';
        }
      });
    }

    function handleGuess(letter) {
      if (isGameOver) return;
      if (guessedLetters.has(letter)) return;

      guessedLetters.add(letter);
      
      // Update Keyboard
      const keyBtn = document.querySelector(`.key[data-key="${letter}"]`);
      keyBtn.disabled = true;

      if (secretWord.includes(letter)) {
        keyBtn.classList.add('correct');
        updateWordDisplay();
        checkWin();
      } else {
        keyBtn.classList.add('wrong');
        wrongGuesses++;
        updateLivesDisplay();
        revealHangmanPart();
        checkLoss();
      }
    }

    function updateLivesDisplay() {
      livesLeftEl.textContent = MAX_WRONG - wrongGuesses;
    }

    function revealHangmanPart() {
      if (wrongGuesses > 0 && wrongGuesses <= MAX_WRONG) {
        parts[wrongGuesses - 1].classList.remove('hidden');
      }
    }

    function checkWin() {
      let allRevealed = true;
      for (let i = 0; i < secretWord.length; i++) {
        if (!guessedLetters.has(secretWord[i])) {
          allRevealed = false;
          break;
        }
      }
      if (allRevealed) {
        endGame(true);
      }
    }

    function checkLoss() {
      if (wrongGuesses >= MAX_WRONG) {
        endGame(false);
      }
    }

    function endGame(isWin) {
      isGameOver = true;
      
      // Disable all keys
      document.querySelectorAll('.key').forEach(key => {
        key.disabled = true;
      });

      // Show Modal
      if (isWin) {
        modalTitle.textContent = "Victory!";
        modalMessage.textContent = gameMode === 'bot' ? "You defeated the Bot!" : "Player 2 guessed it!";
        answerReveal.textContent = secretWord;
        answerReveal.style.color = "var(--correct)";
      } else {
        modalTitle.textContent = "Defeat!";
        modalMessage.textContent = gameMode === 'bot' ? "The Bot won this round." : "Player 2 ran out of lives.";
        answerReveal.textContent = secretWord;
        answerReveal.style.color = "var(--wrong)";
      }

      // Reveal all letters in the word display
      const slots = document.querySelectorAll('.letter-slot');
      slots.forEach(slot => {
        slot.textContent = slot.dataset.letter;
        slot.classList.add('revealed');
      });

      setTimeout(() => {
        endModal.classList.add('show');
      }, 600);
    }

    function resetToMenu() {
      endModal.classList.remove('show');
      gamePanel.style.display = 'none';
      setupPanel.style.display = 'flex';
      
      // Reset setup UI
      if (gameMode === 'bot') {
        modeBotBtn.click();
      } else {
        modePvPBtn.click();
      }
    }

    // Initialize on load
    init();
  </script>
</body>
</html>
